<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torrou! - Web</title>
<style>
  :root{ --bg1:#0b0018; --bg2:#1a0033; --accent:#ff4d6d; }
  html,body{ margin:0; padding:0; min-height:100%; color:#fff; font-family:'Courier New', monospace;
    background: linear-gradient(rgba(5,0,15,.65), rgba(5,0,15,.85)), url('bg.jpg') center/cover no-repeat, radial-gradient(1200px 800px at 20% 10%, #2a004a 0%, #0b0018 45%, #05000d 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center; }
  body::before{ content:''; position:fixed; inset:0; pointer-events:none;
    background:
      radial-gradient(2px 2px at 10% 20%, rgba(255,255,255,.35), transparent 60%),
      radial-gradient(2px 2px at 30% 70%, rgba(255,255,255,.25), transparent 60%),
      radial-gradient(2px 2px at 70% 40%, rgba(255,255,255,.3), transparent 60%),
      radial-gradient(2px 2px at 90% 80%, rgba(255,255,255,.2), transparent 60%);
    opacity:.6; }
  body::after{ content:''; position:fixed; top:8%; right:10%; width:180px; height:180px; pointer-events:none;
    background: radial-gradient(circle at 40% 40%, rgba(255,240,200,.9) 0%, rgba(255,200,120,.5) 30%, rgba(255,120,180,.25) 55%, transparent 70%);
    opacity:.8; }
  .wrap{ display:flex; flex-direction:column; align-items:center; gap:14px; padding:24px; }
  h1{ margin:0; font-size:22px; letter-spacing:2px; color:#fff; text-shadow:0 0 12px #ff4d6d; }
  .sub{ color:#c9a; font-size:13px; }
  #game{ border:2px solid #5a2a6a; border-radius:6px; box-shadow:0 0 40px rgba(255,77,109,.35), inset 0 0 0 1px rgba(255,255,255,.05);
    image-rendering:auto; width:min(92vw, 960px); height:auto; aspect-ratio:4/3; background:#000;
    display:block; contain:layout paint; transform:translateZ(0); will-change:transform; backface-visibility:hidden; }
  /* camadas fixas com filtro podem forcar repaint da pagina inteira a cada frame */
  body.perf-med::after, body.perf-low::after{ display:none; }
  body.perf-med #game, body.perf-low #game{ box-shadow:none; }
  body.perf-low #game{ image-rendering:pixelated; }
  .info{ max-width:960px; text-align:center; font-size:12px; color:#b8a; line-height:1.6; }
  .panel{ display:flex; gap:18px; flex-wrap:wrap; justify-content:center; }
  .tag{ background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); padding:6px 10px; border-radius:6px; font-size:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>TORROU!</h1>
  <div class="sub">Desafio do Prof. Choma: cumprido (com lag e tudo) — fan project</div>
  <canvas id="game"></canvas>
  <div class="panel">
    <span class="tag">Setas/WASD mover</span>
    <span class="tag">Shift foco</span>
    <span class="tag">Z atirar</span>
    <span class="tag">X bomba</span>
    <span class="tag">Enter iniciar</span>
    <span class="tag">Esc pausar</span>
  </div>
  <div class="info">Reimu (homing) / Marisa (poder) — escolha no menu. Resolução base 640×480, painéis de score nas laterais.</div>
</div>
<script src="config.js"></script>
<script src="utils.js"></script>
<script src="input.js"></script>
<script src="audio.js"></script>
<script src="entities.js"></script>
<script src="patterns.js"></script>
<script src="stage.js"></script>
<script src="game.js"></script>
</body>
</html>
